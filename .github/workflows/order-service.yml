name: Build & Push order-service

on:
  push:
    paths: ['./.github/workflows/_ci-service.yml', './.github/workflows/order-service.yml', 'order-service/**', '!order-service/helm/**']
    branches: [ main ]
  pull_request:
    paths: ['./.github/workflows/_ci-service.yml', './.github/workflows/order-service.yml', 'order-service/**', '!order-service/helm/**']
    branches: [ main ]
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/_ci-service.yml
    with:
      service_name: order-service
    secrets: inherit
