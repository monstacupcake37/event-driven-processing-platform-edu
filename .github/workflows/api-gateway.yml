name: Build & Push api-gateway

on:
  push:
    paths: ['api-gateway/**', '!api-gateway/helm/**']
    branches: [ main ]
  pull_request:
    paths: ['api-gateway/**', '!api-gateway/helm/**']
    branches: [ main ]
  workflow_dispatch:

jobs:
  call-reusable:
    uses: ./.github/workflows/_build-and-push-service.yml
    with:
      service_name: api-gateway
    secrets: inherit
