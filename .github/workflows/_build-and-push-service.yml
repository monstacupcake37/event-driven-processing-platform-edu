name: Reusable - Build and Push a Microservice

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Run Checkstyle
        run: mvn checkstyle:check -f ./${{ inputs.service_name }}/pom.xml

      # --- 2. Unit tests with coverage report ---
      - name: Run unit tests & generate JaCoCo coverage report
        run: mvn test jacoco:report -f ./${{ inputs.service_name }}/pom.xml

      # --- 3. Enforce coverage ≥ 80% ---
      - name: Verify code coverage threshold
        run: |
          # Option A: Use JaCoCo's built-in check goal (requires plugin config in pom.xml)
          mvn jacoco:check -f ./${{ inputs.service_name }}/pom.xml \
            -Djacoco.haltOnFailure=true \
            -Djacoco.threshold.line=0.8 \
            -Djacoco.threshold.branch=0.8
      
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.service_name }}
          file: ./${{ inputs.service_name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
